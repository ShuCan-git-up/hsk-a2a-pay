# HashKey Chain is an OP Stack L2. We pin shanghai so the same bytecode deploys
# cleanly on testnet (133) and mainnet (177) without relying on newer opcodes.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[rpc_endpoints]
hsk_testnet = "https://testnet.hsk.xyz"
hsk_mainnet = "https://mainnet.hsk.xyz"
localhost = "http://127.0.0.1:8545"

[fmt]
line_length = 120
